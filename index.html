<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badran CNC - نظام الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #f8fafc;
  --surface: #fff;
  --accent: #f59e0b;
  --accent-dark: #d97706;
  --green: #10b981;
  --blue: #3b82f6;
  --danger: #ef4444;
  --warning: #f59e0b;
  --text: #1e293e;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  direction: rtl;
  min-height: 100vh;
}

/* ===== تحسين شاشة تسجيل الدخول ===== */
#loginScreen {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.login-box {
  background: white;
  border-radius: 20px;
  padding: 40px;
  width: min(420px, 90vw);
  text-align: center;
  box-shadow: var(--shadow-lg);
}

.login-box h1 {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 8px;
}

.login-box p {
  color: #64748b;
  margin-bottom: 24px;
  font-size: 0.95rem;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--text);
  text-align: right;
}

.form-group input {
  width: 100%;
  padding: 12px 14px;
  background: #f8fafc;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  transition: all 0.3s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--accent);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
}

.login-box button {
  width: 100%;
  padding: 12px 14px;
  background: var(--accent);
  border: none;
  border-radius: 12px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.3s;
  margin-top: 8px;
}

.login-box button:hover {
  background: var(--accent-dark);
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.login-box button:active {
  transform: translateY(0);
}

#loginError {
  color: var(--danger);
  margin-top: 12px;
  font-size: 0.9rem;
  font-weight: 600;
  min-height: 20px;
}

.login-info {
  background: #f0f4f8;
  padding: 12px;
  border-radius: 8px;
  margin-top: 16px;
  font-size: 0.85rem;
  color: #475569;
}

/* ===== شاشة الرئيسية ===== */
#app {
  display: none;
  flex-direction: column;
  min-height: 100vh;
}

.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}

.topbar-left {
  font-size: 1.5rem;
  font-weight: 900;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

#userRoleBadge {
  background: var(--accent);
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.9rem;
}

.btn-logout {
  background: var(--danger);
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Cairo', sans-serif;
}

.btn-logout:hover {
  background: #dc2626;
  transform: translateY(-2px);
}

/* ===== التبويبات ===== */
.navtabs {
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  padding: 12px 24px;
  overflow-x: auto;
  scroll-behavior: smooth;
}

.navtab {
  padding: 10px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: 600;
  color: #64748b;
  white-space: nowrap;
  background: transparent;
  border: none;
  transition: all 0.3s;
  font-family: 'Cairo', sans-serif;
}

.navtab:hover {
  background: #f1f5f9;
}

.navtab.active {
  background: var(--accent);
  color: white;
  box-shadow: var(--shadow);
}

/* ===== المحتوى ===== */
.content {
  padding: 24px;
  flex: 1;
  overflow-y: auto;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--accent);
}

.stat-card > div:first-child {
  color: #64748b;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.stat-val {
  font-size: 1.8rem;
  font-weight: 900;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ===== الأقسام ===== */
.section {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 20px;
  border-right: 4px solid var(--accent);
  padding-right: 12px;
  color: var(--text);
}

.form-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 16px;
  margin-bottom: 16px;
}

.form-group input,
.form-group select {
  padding: 12px 14px;
  background: #f8fafc;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: 'Cairo', sans-serif;
  font-size: 1rem;
  transition: all 0.3s;
}

.form-group input:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
}

/* ===== الأزرار ===== */
.btn {
  padding: 10px 24px;
  border-radius: 12px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Cairo', sans-serif;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.btn:active {
  transform: translateY(0);
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-dark);
}

.btn-danger {
  background: var(--danger);
  color: white;
}

.btn-danger:hover {
  background: #dc2626;
}

.btn-success {
  background: var(--green);
  color: white;
}

.btn-success:hover {
  background: #059669;
}

.btn-sm {
  padding: 6px 12px;
  font-size: 0.85rem;
}

.btn-row {
  display: flex;
  gap: 12px;
  margin-top: 16px;
  flex-wrap: wrap;
}

/* ===== الجداول ===== */
.tbl-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead {
  background: #f8fafc;
}

th, td {
  padding: 14px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}

th {
  font-weight: 700;
  color: var(--text);
}

tr:hover {
  background: #f8fafc;
}

tbody tr:last-child td {
  border-bottom: none;
}

/* ===== العناصر الخاصة ===== */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: #94a3b8;
  font-size: 1.1rem;
}

.inv-item-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr auto;
  gap: 12px;
  margin-bottom: 12px;
  align-items: center;
  background: #f8fafc;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
}

.inv-total-box {
  background: linear-gradient(135deg, #f8fafc, #f1f5f9);
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  justify-content: flex-end;
  gap: 30px;
  margin-top: 20px;
  font-weight: 700;
  border: 1px solid var(--border);
}

.tag-red {
  color: var(--danger);
  font-weight: 700;
}

/* ===== Modal ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 5000;
  align-items: center;
  justify-content: center;
}

.modal.active {
  display: flex;
}

.modal-content {
  background: white;
  border-radius: 16px;
  padding: 30px;
  width: min(500px, 90vw);
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
}

.modal-header {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 20px;
  color: var(--text);
  border-bottom: 2px solid var(--border);
  padding-bottom: 12px;
}

.modal-body {
  margin-bottom: 20px;
}

.modal-footer {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  border-top: 1px solid var(--border);
  padding-top: 20px;
}

.close-modal {
  float: left;
  cursor: pointer;
  font-size: 1.5rem;
  color: #94a3b8;
  transition: all 0.3s;
}

.close-modal:hover {
  color: var(--text);
}

/* ===== الشارات ===== */
.badge {
  display: inline-block;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.85rem;
  font-weight: 600;
}

.badge-warning {
  background: #fef3c7;
  color: #d97706;
}

.badge-success {
  background: #d1fae5;
  color: #059669;
}

.badge-danger {
  background: #fee2e2;
  color: #dc2626;
}

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .topbar {
    padding: 0 16px;
    height: 60px;
  }

  .content {
    padding: 16px;
  }

  .stat-grid {
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  }

  .inv-item-row {
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .inv-total-box {
    flex-direction: column;
    gap: 12px;
  }

  .navtabs {
    padding: 8px 16px;
  }

  table {
    font-size: 0.9rem;
  }

  th, td {
    padding: 10px 8px;
  }
}

/* ===== الطباعة ===== */
@media print {
  body * {
    visibility: hidden;
  }

  .print-area, .print-area * {
    visibility: visible;
  }

  .print-area {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    direction: rtl;
  }
}
</style>
</head>
<body>

<!-- ===== شاشة تسجيل الدخول ===== -->
<div id="loginScreen">
  <div class="login-box">
    <h1>BADRAN CNC</h1>
    <p>🏭 نظام إدارة المبيعات والمخزون</p>
    
    <div class="form-group">
      <label>👤 اسم المستخدم</label>
      <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم">
    </div>
    
    <div class="form-group">
      <label>🔐 كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="أدخل كلمة المرور" onkeypress="if(event.key==='Enter') checkLogin()">
    </div>
    
    <button onclick="checkLogin()">🔓 دخول</button>
    <div id="loginError"></div>
    
    <div class="login-info">
      <strong>بيانات تجريبية:</strong><br>
      المستخدم: badran<br>
      أدمن: admin123 | مستخدم: 1234
    </div>
  </div>
</div>

<!-- ===== التطبيق الرئيسي ===== -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">🏭 Badran CNC</div>
    <div class="topbar-right">
      <span id="userRoleBadge"></span>
      <button class="btn-logout" onclick="logout()">🚪 خروج</button>
    </div>
  </div>
  
  <div class="navtabs" id="navTabs"></div>
  <div class="content" id="contentArea"></div>
</div>

<!-- ===== Modal العام ===== -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="modal-header" style="border: none; padding: 0; margin: 0; flex: 1;"></div>
      <span class="close-modal" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<script>
// ========== متغيرات التطبيق ==========
let currentUser = null;
let products = [], invoices = [], returns = [];
const LOW_STOCK_THRESHOLD = 20;
let currentInvoiceItems = [];
let sessionToken = null;

// ========== إدارة التخزين المحلي (بأمان أكثر) ==========
function saveToLocalStorage() {
  const data = { products, invoices, returns };
  localStorage.setItem('badran_data', JSON.stringify(data));
}

function loadFromLocalStorage() {
  const local = localStorage.getItem('badran_data');
  if (local) {
    try {
      const data = JSON.parse(local);
      products = data.products || [];
      invoices = data.invoices || [];
      returns = data.returns || [];
    } catch (e) {
      console.error('خطأ في تحميل البيانات:', e);
    }
  }
  
  if (!products.length) {
    products = [
      { id: 1, name: "سبندل 2.2 كيلو", sellPrice: 4500, buyPrice: 3200, stock: 10 },
      { id: 2, name: "كنترولر Mach3", sellPrice: 1250, buyPrice: 800, stock: 15 },
      { id: 3, name: "موتور Nema23", sellPrice: 890, buyPrice: 550, stock: 25 },
      { id: 4, name: "دراع روبوت", sellPrice: 3200, buyPrice: 2100, stock: 5 },
      { id: 5, name: "سيرفو 1.5kw", sellPrice: 2850, buyPrice: 1900, stock: 18 }
    ];
    saveToLocalStorage();
  }
}

// ========== تسجيل الدخول ==========
function checkLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPass').value;
  const errorEl = document.getElementById('loginError');
  
  errorEl.innerText = '';
  
  if (!username) {
    errorEl.innerText = '❌ من فضلك أدخل اسم المستخدم';
    return;
  }
  
  if (!password) {
    errorEl.innerText = '❌ من فضلك أدخل كلمة المرور';
    return;
  }
  
  if (username !== 'badran') {
    errorEl.innerText = '❌ اسم المستخدم غير صحيح';
    return;
  }
  
  if (password === 'admin123') {
    currentUser = { role: 'admin', name: 'مدير النظام' };
    sessionToken = generateToken();
    startApp();
  } else if (password === '1234') {
    currentUser = { role: 'user', name: 'موظف' };
    sessionToken = generateToken();
    startApp();
  } else {
    errorEl.innerText = '❌ كلمة المرور غير صحيحة';
  }
}

function generateToken() {
  return 'token_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now();
}

function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadFromLocalStorage();
  renderTabs();
  renderDashboard();
  updateUserBadge();
}

function logout() {
  if (confirm('⚠️ هل تريد فعلاً تسجيل الخروج؟')) {
    currentUser = null;
    sessionToken = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPass').value = '';
  }
}

function updateUserBadge() {
  const badge = document.getElementById('userRoleBadge');
  if (currentUser.role === 'admin') {
    badge.innerText = '👑 مدير النظام';
    badge.style.background = '#d97706';
  } else {
    badge.innerText = '👤 موظف';
    badge.style.background = '#3b82f6';
  }
}

// ========== إدارة التبويبات ==========
function renderTabs() {
  let tabs = [
    { id: 'dashboard', name: '📊 الرئيسية' },
    { id: 'products', name: '📦 المنتجات' },
    { id: 'sales', name: '🛒 البيع' },
    { id: 'invoices', name: '📄 الفواتير' },
    { id: 'returns', name: '🔄 المرتجعات' },
    { id: 'revenue', name: '💰 الإيرادات' }
  ];
  
  if (currentUser.role === 'admin') {
    tabs.push({ id: 'shortages', name: '⚠️ النواقص' });
    tabs.push({ id: 'settings', name: '⚙️ الإعدادات' });
  }
  
  let html = tabs.map(t => `<button class="navtab" onclick="switchTab('${t.id}')">${t.name}</button>`).join('');
  document.getElementById('navTabs').innerHTML = html;
  document.querySelector('.navtab')?.classList.add('active');
}

function switchTab(tabId) {
  document.querySelectorAll('.navtab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  
  const views = {
    'dashboard': renderDashboard,
    'products': renderProductsPage,
    'sales': renderSalesPage,
    'invoices': renderInvoicesPage,
    'returns': renderReturnsPage,
    'revenue': renderRevenuePage,
    'shortages': renderShortagesPage,
    'settings': renderSettingsPage
  };
  
  if (views[tabId]) {
    views[tabId]();
  }
}

// ========== لوحة التحكم ==========
function renderDashboard() {
  let totalStock = products.reduce((s, p) => s + p.stock, 0);
  let totalSales = invoices.reduce((s, i) => s + i.total, 0);
  let totalReturns = returns.reduce((s, r) => s + r.total, 0);
  let net = totalSales - totalReturns;
  let lowCount = products.filter(p => p.stock < LOW_STOCK_THRESHOLD).length;
  
  let html = `
    <div class="stat-grid">
      <div class="stat-card">
        <div>📦 عدد المنتجات</div>
        <div class="stat-val">${products.length}</div>
      </div>
      <div class="stat-card">
        <div>📊 إجمالي المخزون</div>
        <div class="stat-val">${totalStock}</div>
      </div>
      <div class="stat-card">
        <div>💳 المبيعات</div>
        <div class="stat-val">${totalSales.toFixed(0)} ج</div>
      </div>
      <div class="stat-card">
        <div>↩️ المرتجعات</div>
        <div class="stat-val">${totalReturns.toFixed(0)} ج</div>
      </div>
      <div class="stat-card">
        <div>✅ صافي الإيرادات</div>
        <div class="stat-val">${net.toFixed(0)} ج</div>
      </div>
      ${lowCount > 0 ? `<div class="stat-card" style="border-color: var(--warning);">
        <div>⚠️ منتجات ناقصة</div>
        <div class="stat-val" style="color: var(--warning);">${lowCount}</div>
      </div>` : ''}
    </div>
    
    <div class="section">
      <div class="section-title">📋 آخر الفواتير</div>
      ${renderInvoicesTable(invoices.slice(0, 5))}
    </div>
  `;
  
  document.getElementById('contentArea').innerHTML = html;
}

function renderInvoicesTable(invList) {
  if (!invList.length) return '<div class="empty-state">لا توجد فواتير</div>';
  
  let h = '<div class="tbl-wrap"><table><thead><tr><th>#</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th></tr></thead><tbody>';
  invList.forEach((inv, i) => {
    h += `<tr><td>${i + 1}</td><td>${inv.customer}</td><td>${inv.date}</td><td>${inv.total.toFixed(2)} ج</td></tr>`;
  });
  return h + '</tbody></table></div>';
}

// ========== إدارة المنتجات ==========
function renderProductsPage() {
  let html = `
    <div class="section">
      <div class="section-title">📦 المنتجات</div>
      <div class="form-row">
        <div class="form-group">
          <label>🔍 بحث</label>
          <input type="text" id="searchProduct" placeholder="ابحث عن منتج...">
        </div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>المنتج</th>
              <th>سعر البيع</th>
              ${currentUser.role === 'admin' ? '<th>سعر الشراء</th>' : ''}
              <th>المخزون</th>
              <th>الإجراءات</th>
            </tr>
          </thead>
          <tbody id="productsList"></tbody>
        </table>
      </div>
      ${currentUser.role === 'admin' ? '<div class="btn-row"><button class="btn btn-primary" onclick="openAddProductModal()">➕ إضافة منتج</button></div>' : ''}
    </div>
  `;
  document.getElementById('contentArea').innerHTML = html;
  renderProductsList();
  document.getElementById('searchProduct')?.addEventListener('input', () => renderProductsList());
}

function renderProductsList() {
  let search = document.getElementById('searchProduct')?.value.toLowerCase() || '';
  let filtered = products.filter(p => p.name.toLowerCase().includes(search));
  let html = '';
  
  filtered.forEach((p, i) => {
    let statusBadge = '';
    if (p.stock < LOW_STOCK_THRESHOLD) {
      statusBadge = '<span class="badge badge-warning">ناقص</span>';
    } else if (p.stock > 50) {
      statusBadge = '<span class="badge badge-success">متوفر</span>';
    }
    
    html += `<tr>
      <td>${i + 1}</td>
      <td>${p.name} ${statusBadge}</td>
      <td>${p.sellPrice.toFixed(2)} ج</td>
      ${currentUser.role === 'admin' ? `<td>${p.buyPrice.toFixed(2)} ج</td>` : ''}
      <td class="${p.stock < LOW_STOCK_THRESHOLD ? 'tag-red' : ''}">${p.stock}</td>
      <td>
        ${currentUser.role === 'admin' ? `
          <button class="btn btn-sm" style="background: #3b82f6; color: white;" onclick="openEditProductModal(${p.id})">✏️</button>
          <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑️</button>
        ` : ''}
      </td>
    </tr>`;
  });
  
  document.getElementById('productsList').innerHTML = html;
}

      <input type="text" id="productName" placeholder="أدخل اسم المنتج">

    </div>
    <div class="form-group">

      <input type="number" id="productBuyPrice" placeholder="0" min="0" step="0.01">
    </div>
    <div class="form-group">
      <label>الكمية</label>
      <input type="number" id="productStock" placeholder="0" min="0">
    </div>
  `;
  
  openModal('➕ إضافة منتج جديد', html, [
    { text: 'إلغاء', onclick: 'closeModal()' },
    { text: 'إضافة', onclick: 'saveNewProduct()' }
  ]);
}

function saveNewProduct() {
  const name = document.getElementById('productName').value.trim();
  const sellPrice = parseFloat(document.getElementById('productSellPrice').value);
  const buyPrice = parseFloat(document.getElementById('productBuyPrice').value);
  const stock = parseInt(document.getElementById('productStock').value);
  
  if (!name) return alert('❌ أدخل اسم المنتج');
  if (isNaN(sellPrice) || sellPrice <= 0) return alert('❌ سعر البيع غير صحيح');
  if (isNaN(buyPrice) || buyPrice <= 0) return alert('❌ سعر الشراء غير صحيح');
  if (isNaN(stock) || stock < 0) return alert('❌ الكمية غير صحيحة');
  
  products.push({
    id: Date.now(),
    name,
    sellPrice,
    buyPrice,
    stock
  });
  
  saveToLocalStorage();
  closeModal();
  renderProductsList();
  alert('✅ تم إضافة المنتج بنجاح');
}

function openEditProductModal(id) {
  let p = products.find(pr => pr.id === id);
  if (!p) return;
  
  let html = `

      <label>اسم المنتج</label>
      <input type="text" id="productName" value="${p.name}">
    </div>
    <div class="form-group">
      <label>سعر البيع</label>
      <input type="number" id="productSellPrice" value="${p.sellPrice}" step="0.01">
    </div>
    <div class="form-group">
      <label>سعر الشراء</label>
      <input type="number" id="productBuyPrice" value="${p.buyPrice}" step="0.01">
    </div>
    <div class="form-group">
      <label>الكمية</label>
      <input type="number" id="productStock" value="${p.stock}">
    </div>
  `;
  
  openModal('✏️ تعديل المنتج', html, [
    { text: 'إلغاء', onclick: 'closeModal()' },
    { text: 'حفظ', onclick: 'saveEditProduct(' + id + ')' }
  ]);
}

function saveEditProduct(id) {
  let p = products.find(pr => pr.id === id);
  if (!p) return;
  
  p.name = document.getElementById('productName').value.trim();
  p.sellPrice = parseFloat(document.getElementById('productSellPrice').value);
  p.buyPrice = parseFloat(document.getElementById('productBuyPrice').value);
  p.stock = parseInt(document.getElementById('productStock').value);
  
  saveToLocalStorage();

function deleteProduct(id) {

function renderProductSelect() {
  let sel = document.getElementById('productSelect');
  if (!sel) return;
  
  sel.innerHTML = '<option value="">-- اختر منتجاً --</option>' +
    products
      .filter(p => p.stock > 0)
      .map(p => `<option value="${p.id}">${p.name} - ${p.sellPrice} ج (المتبقي: ${p.stock})</option>`)
      .join('');
}

function addToInvoice() {
  let pid = document.getElementById('productSelect').value;
  if (!pid) return alert('❌ اختر منتجاً');
  
  let prod = products.find(p => p.id == pid);
  if (prod.stock <= 0) return alert('❌ المنتج غير متوفر');
  
  let custom = parseFloat(document.getElementById('customPrice').value);
  let price = !isNaN(custom) && custom > 0 ? custom : prod.sellPrice;
  
  let exist = currentInvoiceItems.find(i => i.productId == pid && i.sellPrice === price);
  if (exist) {
    if (exist.quantity + 1 > prod.stock) return alert('❌ الكمية المطلوبة تتجاوز المتوفر');
    exist.quantity++;
  } else {
    currentInvoiceItems.push({
      productId: prod.id,
      name: prod.name,
      sellPrice: price,
      quantity: 1
    });
  }
  
  renderCurrentInvoice();
  document.getElementById('customPrice').value = '';
}

function renderCurrentInvoice() {
  let cont = document.getElementById('invItems');
  if (!cont) return;
  
  let html = '';
  currentInvoiceItems.forEach((it, i) => {
    let itemTotal = it.quantity * it.sellPrice;
    html += `
      <div class="inv-item-row">
        <div><strong>${it.name}</strong></div>
        <div>
          <input type="number" value="${it.sellPrice}" onchange="updatePrice(${i}, this.value)" 
                 style="width: 100px; padding: 6px;" min="0" step="0.01">
        </div>
        <div>
          <button class="btn btn-sm" onclick="changeQty(${i}, -1)">−</button>
          <span style="margin: 0 8px; font-weight: bold;">${it.quantity}</span>
          <button class="btn btn-sm" onclick="changeQty(${i}, 1)">+</button>
        </div>
        <div style="font-weight: bold;">${itemTotal.toFixed(2)} ج</div>
        <button class="btn btn-sm btn-danger" onclick="removeItem(${i})">🗑️</button>
      </div>
    `;
  });
  
  cont.innerHTML = html;
  let total = currentInvoiceItems.reduce((s, i) => s + (i.quantity * i.sellPrice), 0);
  document.getElementById('invoiceTotal').innerText = total.toFixed(2);
}

function updatePrice(idx, val) {
  let p = parseFloat(val);
  if (!isNaN(p) && p > 0) {
    currentInvoiceItems[idx].sellPrice = p;
    renderCurrentInvoice();
  }
}

function changeQty(idx, delta) {
  let it = currentInvoiceItems[idx];
  let prod = products.find(p => p.id == it.productId);
  let nq = it.quantity + delta;
  
  if (nq < 1) {
    removeItem(idx);
    return;
  }
  
  if (nq > prod.stock) {
    alert('❌ الكمية المطلوبة تتجاوز المتوفر');
    return;
  }
  
  it.quantity = nq;
  renderCurrentInvoice();
}

function removeItem(idx) {
  currentInvoiceItems.splice(idx, 1);
  renderCurrentInvoice();
}

function clearInvoice() {
  if (confirm('⚠️ هل تريد مسح الفاتورة؟')) {
    currentInvoiceItems = [];
    renderCurrentInvoice();
    document.getElementById('customerName').value = '';
  }
}

function saveInvoice() {
  let cust = document.getElementById('customerName').value.trim();
  if (!cust) return alert('❌ أدخل اسم العميل');
  if (currentInvoiceItems.length === 0) return alert('❌ أضف منتجات للفاتورة');
  
  for (let it of currentInvoiceItems) {
    let prod = products.find(p => p.id == it.productId);
    if (prod.stock < it.quantity) return alert(`❌ الكمية من ${prod.name} غير متوفرة`);
    prod.stock -= it.quantity;
  }
  
  let total = currentInvoiceItems.reduce((s, i) => s + (i.quantity * i.sellPrice), 0);
  let now = new Date();
  let date = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG');
  
  let invoice = {
    id: Date.now(),
    customer: cust,
    date: date,
    items: JSON.parse(JSON.stringify(currentInvoiceItems)),
    total: total
  };
  
  invoices.unshift(invoice);
  saveToLocalStorage();
  clearInvoice();
  alert('✅ تم حفظ الفاتورة بنجاح');
  renderInvoicesPage();
}

function deleteInvoice(id) {
  if (!confirm('⚠️ هل تريد حذف هذه الفاتورة؟')) return;
  
  let inv = invoices.find(i => i.id === id);
  if (inv) {
    inv.items.forEach(item => {
      let prod = products.find(p => p.name === item.name);
      if (prod) prod.stock += item.quantity;
    });
    invoices = invoices.filter(i => i.id !== id);
    saveToLocalStorage();
    renderInvoicesPage();
    alert('✅ تم حذف الفاتورة');
  }
}

function editInvoice(id) {
  let inv = invoices.find(i => i.id === id);
  if (!inv) return;
  
  let itemsHtml = inv.items
    .map(
      (item, idx) =>
        `
    <div class="inv-item-row">
      <div>${item.name}</div>
      <div>${item.sellPrice.toFixed(2)} ج</div>
      <div>
        <input type="number" id="editQty${idx}" value="${item.quantity}" min="1" max="999" 
               style="width: 80px; padding: 6px;">
      </div>
      <div>${(item.quantity * item.sellPrice).toFixed(2)} ج</div>
    </div>
  `
    )
    .join('');
  
  let html = `
    <div class="form-group">
      <label>👤 اسم العميل</label>
      <input type="text" id="editCustomer" value="${inv.customer}">
    </div>
    <div style="margin-top: 20px;">
      <strong>المنتجات:</strong>
      ${itemsHtml}
    </div>
  `;
  
  openModal('✏️ تعديل الفاتورة', html, [
    { text: 'إلغاء', onclick: 'closeModal()' },
    {
      text: 'حفظ',
      onclick: `updateInvoice(${id}, ${JSON.stringify(inv.items).replace(/"/g, '&quot;')})`
    }
  ]);
}

function updateInvoice(id, originalItems) {
  let inv = invoices.find(i => i.id === id);
  if (!inv) return;
  
  inv.customer = document.getElementById('editCustomer').value.trim();
  
  inv.items.forEach((item, idx) => {
    let oldQty = item.quantity;
    let newQty = parseInt(document.getElementById(`editQty${idx}`).value) || oldQty;
    let prod = products.find(p => p.name === item.name);
    
    if (prod) {
      let diff = oldQty - newQty;
      prod.stock += diff;
    }
    
    item.quantity = newQty;
  });
  
  inv.total = inv.items.reduce((s, i) => s + i.quantity * i.sellPrice, 0);
  saveToLocalStorage();
  closeModal();
  renderInvoicesPage();
  alert('✅ تم تعديل الفاتورة');
}

function loadReturnInvoice() {
  let id = document.getElementById('retInvoiceSelect').value;
  if (!id) return alert('❌ اختر فاتورة');
  
  let inv = invoices.find(i => i.id == id);
  if (!inv) return;
  
  let html = `<div class="tbl-wrap"><table><thead><tr><th>المنتج</th><th>الكمية الأصلية</th><th>السعر</th><th>كمية الإرجاع</th></tr></thead><tbody>`;
  inv.items.forEach((it, i) => {
    html += `
      <tr>
        <td>${it.name}</td>
        <td style="text-align: center">${it.quantity}</td>
        <td>${it.sellPrice.toFixed(2)} ج</td>
        <td><input type="number" id="retQty${i}" min="0" max="${it.quantity}" value="0" style="width: 80px; padding: 6px;"></td>
      </tr>
    `;
  });
  
  html += `</tbody></table></div>
    <div class="btn-row">
      <button class="btn btn-success" onclick="processReturn(${id})">✅ تأكيد الإرجاع</button>
    </div>
    <input type="hidden" id="returnInvId" value="${inv.id}">`;
  
  document.getElementById('returnItemsArea').innerHTML = html;
}

function processReturn(invId) {
  let inv = invoices.find(i => i.id == invId);
  if (!inv) return;
  
  let returned = [];
  let total = 0;
  
  for (let i = 0; i < inv.items.length; i++) {
    let qty = parseInt(document.getElementById(`retQty${i}`)?.value || 0);
    if (qty > 0) {
      let prod = products.find(p => p.name === inv.items[i].name);
      if (prod) prod.stock += qty;
      
      returned.push({
        name: inv.items[i].name,
        quantity: qty,
        price: inv.items[i].sellPrice
      });
      
      total += qty * inv.items[i].sellPrice;
    }
  }
  
  if (returned.length === 0) return alert('❌ لم تختر أي منتجات');
  
  let now = new Date();
  let date = now.toLocaleDateString('ar-EG') + ' ' + now.toLocaleTimeString('ar-EG');
  
  returns.unshift({
    id: Date.now(),
    invoiceId: invId,
    date: date,
    items: returned,
    total: total
  });
  
  saveToLocalStorage();
  document.getElementById('returnItemsArea').innerHTML = '';
  renderReturnsHistory();
  alert(`✅ تم معالجة الإرجاع بقيمة ${total.toFixed(2)} ج`);
}

function renderReturnsHistory() {
  let c = document.getElementById('returnsHistory');
  if (!c) return;
  
  if (returns.length === 0) {
    c.innerHTML = '<div class="empty-state">لا توجد مرتجعات</div>';
    return;
  }
  
  let html = `<div class="tbl-wrap"><table>
    <thead>
      <tr>
        <th>#</th>
        <th>التاريخ</th>
        <th>الفاتورة</th>
        <th>المنتجات</th>
        <th>الإجمالي</th>
      </tr>
    </thead>
    <tbody>`;
  
  returns.forEach((r, i) => {
    html += `
      <tr>
        <td>${i + 1}</td>
        <td>${r.date}</td>
        <td>#${r.invoiceId}</td>
        <td>${r.items.map(item => `${item.name} ×${item.quantity}`).join(', ')}</td>
        <td>${r.total.toFixed(2)} ج</td>
      </tr>
    `;
  });
  
  html += '</tbody></table></div>';
  c.innerHTML = html;
}

// ========== الإيرادات ==========
function renderRevenuePage() {
  let today = new Date().toISOString().split('T')[0];
  let todayTotal = 0,
    monthTotal = 0,
    allTotal = 0;
  let now = new Date(),
    monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  
  invoices.forEach(inv => {
    let d = inv.date.split(' ')[0];
    allTotal += inv.total;
    if (d === today) todayTotal += inv.total;
    if (new Date(d) >= monthStart) monthTotal += inv.total;
  });
  
  let retTotal = returns.reduce((s, r) => s + r.total, 0);
  let netRevenue = allTotal - retTotal;
  
  let html = `
    <div class="stat-grid">
      <div class="stat-card">
        <div>📅 اليوم</div>
        <div class="stat-val">${todayTotal.toFixed(0)} ج</div>
      </div>
      <div class="stat-card">
        <div>📊 هذا الشهر</div>
        <div class="stat-val">${monthTotal.toFixed(0)} ج</div>
      </div>
      <div class="stat-card">
        <div>💰 الإجمالي الكلي</div>
        <div class="stat-val">${allTotal.toFixed(0)} ج</div>
      </div>
      <div class="stat-card">
        <div>↩️ المرتجعات</div>
        <div class="stat-val">${retTotal.toFixed(0)} ج</div>
      </div>
      <div class="stat-card">
        <div>✅ صافي الإيرادات</div>
        <div class="stat-val">${netRevenue.toFixed(0)} ج</div>
      </div>
    </div>
    
    <div class="section">
      <div class="section-title">📊 جميع الفواتير</div>
      ${renderInvoicesTable(invoices)}
    </div>
  `;

// ========== النواقص ==========
function renderShortagesPage() {
  let low = products.filter(p => p.stock < LOW_STOCK_THRESHOLD);
  
  let html = `
    <div class="section">
      <div class="section-title">⚠️ المنتجات الناقصة (أقل من ${LOW_STOCK_THRESHOLD} وحدة)</div>

        <button class="btn" style="background: #3b82f6; color: white;" onclick="printShortages()">🖨️ طباعة</button>
      </div>
    </div>
  `;
  
  document.getElementById('contentArea').innerHTML = html;
  
  let shortList = document.getElementById('shortList');
  
  if (low.length === 0) {
    shortList.innerHTML = '<div class="empty-state">✅ ممتاز! جميع المنتجات متوفرة</div>';
  } else {
    let tableHtml = `<div class="tbl-wrap"><table>
      <thead>
        <tr>
          <th>#</th>
          <th>المنتج</th>
          <th>الرصيد الحالي</th>

          <th>الفرق</th>
          <th>سعر الشراء</th>
          <th>التكلفة المقدرة</th>
        </tr>
      </thead>
      <tbody>`;
    
    low.forEach((p, i) => {
      let shortage = LOW_STOCK_THRESHOLD - p.stock;
      let estimatedCost = shortage * p.buyPrice;
      tableHtml += `
        <tr>
          <td>${i + 1}</td>
          <td>${p.name}</td>
          <td class="tag-red">${p.stock}</td>
          <td>${LOW_STOCK_THRESHOLD}</td>
          <td class="tag-red"><strong>${shortage}</strong></td>
          <td>${p.buyPrice.toFixed(2)} ج</td>
          <td><strong>${estimatedCost.toFixed(2)} ج</strong></td>
        </tr>
      `;
    });
    
    tableHtml += '</tbody></table></div>';
    shortList.innerHTML = tableHtml;
  }
}

function saveAdminPassword() {
  let oldPass = document.getElementById('oldAdminPass').value;
  let newPass = document.getElementById('newAdminPass').value;
  let confirmPass = document.getElementById('confirmAdminPass').value;
  
  if (oldPass !== 'admin123') {
    return alert('❌ الباسورد الحالي غير صحيح');
  }
  
  if (newPass.length < 4) {
    return alert('❌ الباسورد الجديد يجب أن يكون 4 أحرف على الأقل');
  }
  
  if (newPass !== confirmPass) {
    return alert('❌ الباسوردات غير متطابقة');
  }
  
  // في التطبيق الحقيقي، يجب حفظ هذا بأمان على سيرفر
  alert('✅ تم تحديث الباسورد (ملاحظة: في النسخة التجريبية فقط، يجب حفظه بأمان على سيرفر)');
  closeModal();
}

function saveUserPassword() {
  let oldPass = document.getElementById('oldUserPass').value;
  let newPass = document.getElementById('newUserPass').value;
  let confirmPass = document.getElementById('confirmUserPass').value;
  
  if (oldPass !== '1234') {
    return alert('❌ الباسورد الحالي غير صحيح');
  }
  
  if (newPass.length < 4) {
    return alert('❌ الباسورد الجديد يجب أن يكون 4 أحرف على الأقل');
  }
  
  if (newPass !== confirmPass) {
    return alert('❌ الباسوردات غير متطابقة');
  }
  
  alert('✅ تم تحديث الباسورد (ملاحظة: في النسخة التجريبية فقط، يجب حفظه بأمان على سيرفر)');
  closeModal();
}

function exportData() {
  const data = { products, invoices, returns, exportDate: new Date().toLocaleString('ar-EG') };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `badran-backup-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  alert('✅ تم تصدير البيانات بنجاح');
}

function clearAllData() {
  if (
    !confirm(
      '⚠️ تحذير! هذه العملية ستحذف جميع البيانات نهائياً ولا يمكن التراجع عنها. هل أنت متأكد؟'
    )
  ) {
    return;
  }
  
  if (!confirm('⚠️ تأكيد نهائي: هل تريد حذف جميع البيانات؟')) {
    return;
  }
  
  products = [];
  invoices = [];
  returns = [];
  currentInvoiceItems = [];
  localStorage.clear();
  alert('✅ تم حذف جميع البيانات');
  renderSettingsPage();
}

// ========== إدارة Modal ==========
function openModal(title, body, buttons) {
  const modal = document.getElementById('modal');
  const modalHeader = modal.querySelector('.modal-header');
  const modalBody = document.getElementById('modalBody');
  const modalFooter = document.getElementById('modalFooter');
  
  modalHeader.innerText = title;
  modalBody.innerHTML = body;
  
  let footerHtml = '';
  buttons.forEach(btn => {
    footerHtml += `<button class="btn btn-primary" onclick="${btn.onclick}">${btn.text}</button>`;
  });
  
  modalFooter.innerHTML = footerHtml;
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

// أغلق modal عند النقر خارجه
document.addEventListener('click', function(event) {
  const modal = document.getElementById('modal');
  if (event.target === modal) {
    closeModal();
  }
});

window.addEventListener('load', () => {
  loadFromLocalStorage();
});
