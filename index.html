<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badran CNC - نظام الإدارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
:root {
  --bg: #f0f4f8;
  --surface: #ffffff;
  --primary: #1e3a5f;      /* كحلي غامق */
  --primary-dark: #0f2b44;
  --primary-light: #2c5282;
  --accent: #3b82f6;
  --green: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --text: #1e293b;
  --border: #e2e8f0;
  --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
  --shadow-lg: 0 10px 25px -5px rgb(0 0 0 / 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  direction: rtl;
  min-height: 100vh;
  position: relative;
}

/* العلامة المائية الخلفية */
body::before {
  content: "";
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-image: url('logo-badran.png');
  background-repeat: repeat;
  background-position: center;
  background-size: 120px;
  opacity: 0.05;
  pointer-events: none;
  z-index: 0;
}

/* ===== شاشة تسجيل الدخول ===== */
#loginScreen {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #1e3a5f 0%, #0f2b44 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

.login-box {
  background: white;
  border-radius: 20px;
  padding: 40px;
  width: min(420px, 90vw);
  text-align: center;
  box-shadow: var(--shadow-lg);
  position: relative;
  z-index: 1;
}

.login-box h1 {
  font-size: 2rem;
  font-weight: 900;
  background: linear-gradient(135deg, #1e3a5f, #2c5282);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 8px;
}

.login-logo {
  width: 100px;
  margin-bottom: 20px;
  border-radius: 20px;
}

/* ===== شاشة الرئيسية ===== */
#app {
  display: none;
  flex-direction: column;
  min-height: 100vh;
  position: relative;
  z-index: 1;
}

.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--primary);
}

.topbar-left img {
  height: 45px;
  width: 45px;
  object-fit: contain;
  border-radius: 12px;
  background: white;
  padding: 2px;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 20px;
}

#userRoleBadge {
  background: var(--primary);
  color: white;
  padding: 6px 14px;
  border-radius: 20px;
  font-weight: 600;
  font-size: 0.9rem;
}

.btn-logout {
  background: var(--danger);
  color: white;
  padding: 8px 16px;
  border: none;
  border-radius: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Cairo', sans-serif;
}

.btn-logout:hover {
  background: #dc2626;
  transform: translateY(-2px);
}

/* ===== التبويبات ===== */
.navtabs {
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  gap: 8px;
  padding: 12px 24px;
  overflow-x: auto;
}

.navtab {
  padding: 10px 20px;
  border-radius: 25px;
  cursor: pointer;
  font-weight: 600;
  color: #64748b;
  white-space: nowrap;
  background: transparent;
  border: none;
  transition: all 0.3s;
}

.navtab:hover {
  background: #f1f5f9;
}

.navtab.active {
  background: var(--primary);
  color: white;
  box-shadow: var(--shadow);
}

/* ===== المحتوى ===== */
.content {
  padding: 24px;
  flex: 1;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}

.stat-card {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
  border-color: var(--primary);
}

.stat-card > div:first-child {
  color: #64748b;
  font-size: 0.95rem;
  margin-bottom: 8px;
}

.stat-val {
  font-size: 1.8rem;
  font-weight: 900;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ===== الأقسام ===== */
.section {
  background: white;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}

.section-title {
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: 20px;
  border-right: 4px solid var(--primary);
  padding-right: 12px;
  color: var(--text);
}

/* ===== الأزرار ===== */
.btn {
  padding: 10px 24px;
  border-radius: 12px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  transition: all 0.3s;
  font-family: 'Cairo', sans-serif;
}

.btn-primary {
  background: var(--primary);
  color: white;
}
.btn-primary:hover {
  background: var(--primary-dark);
}
.btn-danger {
  background: var(--danger);
  color: white;
}
.btn-success {
  background: var(--green);
  color: white;
}
.btn-sm {
  padding: 6px 12px;
  font-size: 0.85rem;
}

/* ===== الجداول ===== */
.tbl-wrap {
  overflow-x: auto;
  border-radius: 12px;
  border: 1px solid var(--border);
}
table {
  width: 100%;
  border-collapse: collapse;
}
th, td {
  padding: 14px 12px;
  text-align: right;
  border-bottom: 1px solid var(--border);
}
th {
  background: #f8fafc;
  font-weight: 700;
}
tr:hover {
  background: #f8fafc;
}

/* ===== عناصر الفاتورة ===== */
.inv-item-row {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr 1fr auto;
  gap: 12px;
  margin-bottom: 12px;
  align-items: center;
  background: #f8fafc;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
}
.inv-total-box {
  background: #f8fafc;
  border-radius: 12px;
  padding: 16px 20px;
  display: flex;
  justify-content: flex-end;
  gap: 30px;
  margin-top: 20px;
  font-weight: 700;
}

/* ===== Modal ===== */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 5000;
  align-items: center;
  justify-content: center;
}
.modal.active {
  display: flex;
}
.modal-content {
  background: white;
  border-radius: 16px;
  padding: 30px;
  width: min(500px, 90vw);
  max-height: 90vh;
  overflow-y: auto;
}

/* ===== باقي الأنماط ===== */
.badge-warning {
  background: #fef3c7;
  color: #d97706;
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
}
.empty-state {
  text-align: center;
  padding: 60px;
  color: #94a3b8;
}
.tag-red {
  color: var(--danger);
  font-weight: bold;
}
@media (max-width: 768px) {
  .topbar { padding: 0 16px; height: 60px; }
  .content { padding: 16px; }
  .inv-item-row { grid-template-columns: 1fr; gap: 8px; }
}
</style>
</head>
<body>

<!-- شاشة تسجيل الدخول -->
<div id="loginScreen">
  <div class="login-box">
    <img src="logo-badran.png" alt="Badran CNC" class="login-logo" onerror="this.style.display='none'">
    <h1>BADRAN CNC</h1>
    <p>🏭 نظام إدارة المبيعات والمخزون</p>
    <div class="form-group">
      <label>👤 اسم المستخدم</label>
      <input type="text" id="loginUsername" placeholder="أدخل اسم المستخدم">
    </div>
    <div class="form-group">
      <label>🔐 كلمة المرور</label>
      <input type="password" id="loginPass" placeholder="أدخل كلمة المرور" onkeypress="if(event.key==='Enter') checkLogin()">
    </div>
    <button onclick="checkLogin()">🔓 دخول</button>
    <div id="loginError" class="login-err"></div>
    <div class="login-info">
      <strong>بيانات تجريبية:</strong><br>
      المستخدم: badran<br>
      أدمن: admin123 | مستخدم: 1234
    </div>
  </div>
</div>

<!-- التطبيق الرئيسي -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <img src="logo-badran.png" alt="Badran CNC" onerror="this.style.display='none'">
      <span>🏭 Badran CNC</span>
    </div>
    <div class="topbar-right">
      <span id="userRoleBadge"></span>
      <button class="btn-logout" onclick="logout()">🚪 خروج</button>
    </div>
  </div>
  <div class="navtabs" id="navTabs"></div>
  <div class="content" id="contentArea"></div>
</div>

<!-- Modal العام -->
<div id="modal" class="modal">
  <div class="modal-content">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="modal-header" style="border: none; padding: 0; margin: 0; flex: 1; font-weight: bold; font-size: 1.2rem;"></div>
      <span class="close-modal" style="cursor: pointer; font-size: 1.5rem;" onclick="closeModal()">&times;</span>
    </div>
    <div class="modal-body" id="modalBody" style="margin: 20px 0;"></div>
    <div class="modal-footer" style="display: flex; gap: 12px; justify-content: flex-end; border-top: 1px solid var(--border); padding-top: 20px;" id="modalFooter"></div>
  </div>
</div>

<script>
// ========== متغيرات التطبيق ==========
let currentUser = null;
let products = [], invoices = [], returns = [];
const LOW_STOCK_THRESHOLD = 20;
let currentInvoiceItems = [];

// التخزين المحلي
function saveToLocalStorage() {
  localStorage.setItem('badran_data', JSON.stringify({ products, invoices, returns }));
}
function loadFromLocalStorage() {
  const local = localStorage.getItem('badran_data');
  if (local) {
    try {
      const data = JSON.parse(local);
      products = data.products || [];
      invoices = data.invoices || [];
      returns = data.returns || [];
    } catch(e) {}
  }
  if (!products.length) {
    products = [
      { id: 1, name: "سبندل 2.2 كيلو", sellPrice: 4500, buyPrice: 3200, stock: 10 },
      { id: 2, name: "كنترولر Mach3", sellPrice: 1250, buyPrice: 800, stock: 15 },
      { id: 3, name: "موتور Nema23", sellPrice: 890, buyPrice: 550, stock: 25 },
      { id: 4, name: "دراع روبوت", sellPrice: 3200, buyPrice: 2100, stock: 5 },
      { id: 5, name: "سيرفو 1.5kw", sellPrice: 2850, buyPrice: 1900, stock: 18 }
    ];
    saveToLocalStorage();
  }
}

// تسجيل الدخول
function checkLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPass').value;
  const errorEl = document.getElementById('loginError');
  errorEl.innerText = '';
  if (!username) { errorEl.innerText = '❌ أدخل اسم المستخدم'; return; }
  if (!password) { errorEl.innerText = '❌ أدخل كلمة المرور'; return; }
  if (username !== 'badran') { errorEl.innerText = '❌ اسم المستخدم غير صحيح'; return; }
  if (password === 'admin123') {
    currentUser = { role: 'admin', name: 'مدير النظام' };
    startApp();
  } else if (password === '1234') {
    currentUser = { role: 'user', name: 'موظف' };
    startApp();
  } else {
    errorEl.innerText = '❌ كلمة المرور غير صحيحة';
  }
}
function startApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'flex';
  loadFromLocalStorage();
  renderTabs();
  renderDashboard();
  document.getElementById('userRoleBadge').innerText = currentUser.role === 'admin' ? '👑 مدير النظام' : '👤 موظف';
}
function logout() {
  if (confirm('⚠️ هل تريد تسجيل الخروج؟')) {
    currentUser = null;
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPass').value = '';
  }
}

// التبويبات
function renderTabs() {
  let tabs = [
    { id: 'dashboard', name: '📊 الرئيسية' },
    { id: 'products', name: '📦 المنتجات' },
    { id: 'sales', name: '🛒 البيع' },
    { id: 'invoices', name: '📄 الفواتير' },
    { id: 'returns', name: '🔄 المرتجعات' },
    { id: 'revenue', name: '💰 الإيرادات' }
  ];
  if (currentUser.role === 'admin') {
    tabs.push({ id: 'shortages', name: '⚠️ النواقص' });
    tabs.push({ id: 'settings', name: '⚙️ الإعدادات' });
  }
  document.getElementById('navTabs').innerHTML = tabs.map(t => `<button class="navtab" onclick="switchTab('${t.id}')">${t.name}</button>`).join('');
  document.querySelector('.navtab')?.classList.add('active');
}
function switchTab(tabId) {
  document.querySelectorAll('.navtab').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (tabId === 'dashboard') renderDashboard();
  else if (tabId === 'products') renderProductsPage();
  else if (tabId === 'sales') renderSalesPage();
  else if (tabId === 'invoices') renderInvoicesPage();
  else if (tabId === 'returns') renderReturnsPage();
  else if (tabId === 'revenue') renderRevenuePage();
  else if (tabId === 'shortages') renderShortagesPage();
  else if (tabId === 'settings') renderSettingsPage();
}

// لوحة التحكم
function renderDashboard() {
  let totalStock = products.reduce((s,p)=>s+p.stock,0);
  let totalSales = invoices.reduce((s,i)=>s+i.total,0);
  let totalReturns = returns.reduce((s,r)=>s+r.total,0);
  let net = totalSales - totalReturns;
  let lowCount = products.filter(p=>p.stock<LOW_STOCK_THRESHOLD).length;
  let html = `<div class="stat-grid">
    <div class="stat-card"><div>📦 عدد المنتجات</div><div class="stat-val">${products.length}</div></div>
    <div class="stat-card"><div>📊 إجمالي المخزون</div><div class="stat-val">${totalStock}</div></div>
    <div class="stat-card"><div>💳 المبيعات</div><div class="stat-val">${totalSales.toFixed(0)} ج</div></div>
    <div class="stat-card"><div>↩️ المرتجعات</div><div class="stat-val">${totalReturns.toFixed(0)} ج</div></div>
    <div class="stat-card"><div>✅ صافي الإيرادات</div><div class="stat-val">${net.toFixed(0)} ج</div></div>
    ${lowCount>0?`<div class="stat-card" style="border-color:var(--warning);"><div>⚠️ منتجات ناقصة</div><div class="stat-val" style="color:var(--warning);">${lowCount}</div></div>`:''}
  </div>
  <div class="section"><div class="section-title">📋 آخر الفواتير</div>${renderInvoicesTable(invoices.slice(0,5))}</div>`;
  document.getElementById('contentArea').innerHTML = html;
}
function renderInvoicesTable(invList) {
  if(!invList.length) return '<div class="empty-state">لا توجد فواتير</div>';
  let h='<div class="tbl-wrap"></td><thead><tr><th>#</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th></tr></thead><tbody>';
  invList.forEach((inv,i)=>{h+=`<tr><td>${i+1}</td><td>${inv.customer}</td><td>${inv.date}</td><td>${inv.total.toFixed(2)} ج</td></tr>`;});
  return h+'</tbody></table></div>';
}

// المنتجات (نفس الوظائف السابقة مع تحسينات)
function renderProductsPage() {
  let html = `<div class="section"><div class="section-title">📦 المنتجات</div><div class="form-row"><div class="form-group"><label>🔍 بحث</label><input type="text" id="searchProduct" placeholder="ابحث..."></div></div>
  <div class="tbl-wrap"><table><thead><tr><th>#</th><th>المنتج</th><th>سعر البيع</th>${currentUser.role==='admin'?'<th>سعر الشراء</th>':''}<th>المخزون</th><th></th></tr></thead><tbody id="productsList"></tbody></table></div>
  ${currentUser.role==='admin'?'<div class="btn-row"><button class="btn btn-primary" onclick="openAddProductModal()">➕ إضافة منتج</button></div>':''}</div>`;
  document.getElementById('contentArea').innerHTML = html;
  renderProductsList();
  document.getElementById('searchProduct')?.addEventListener('input',()=>renderProductsList());
}
function renderProductsList() {
  let search = document.getElementById('searchProduct')?.value.toLowerCase()||'';
  let filtered = products.filter(p=>p.name.toLowerCase().includes(search));
  let html='';
  filtered.forEach((p,i)=>{
    let badge = p.stock<LOW_STOCK_THRESHOLD ? '<span class="badge-warning">ناقص</span>' : '';
    html+=`<tr><td>${i+1}</td><td>${p.name} ${badge}</td><td>${p.sellPrice.toFixed(2)} ج</td>${currentUser.role==='admin'?`<td>${p.buyPrice.toFixed(2)} ج</td>`:''}<td class="${p.stock<LOW_STOCK_THRESHOLD?'tag-red':''}">${p.stock}</td>
    <td>${currentUser.role==='admin'?`<button class="btn btn-sm" style="background:#3b82f6;color:white;" onclick="openEditProductModal(${p.id})">✏️</button> <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑️</button>`:''}</td></tr>`;
  });
  document.getElementById('productsList').innerHTML = html;
}
function openAddProductModal() {
  let body = `<div class="form-group"><label>اسم المنتج</label><input type="text" id="productName"></div>
  <div class="form-group"><label>سعر البيع</label><input type="number" id="productSellPrice" min="0" step="0.01"></div>
  <div class="form-group"><label>سعر الشراء</label><input type="number" id="productBuyPrice" min="0" step="0.01"></div>
  <div class="form-group"><label>الكمية</label><input type="number" id="productStock" min="0"></div>`;
  openModal('➕ إضافة منتج', body, '<button class="btn btn-primary" onclick="saveNewProduct()">إضافة</button><button class="btn btn-danger" onclick="closeModal()">إلغاء</button>');
}
function saveNewProduct() {
  let name = document.getElementById('productName').value.trim();
  let sell = parseFloat(document.getElementById('productSellPrice').value);
  let buy = parseFloat(document.getElementById('productBuyPrice').value);
  let stock = parseInt(document.getElementById('productStock').value);
  if(!name) return alert('أدخل اسم المنتج');
  if(isNaN(sell)||sell<=0) return alert('سعر بيع غير صحيح');
  if(isNaN(buy)||buy<=0) return alert('سعر شراء غير صحيح');
  if(isNaN(stock)||stock<0) return alert('كمية غير صحيحة');
  products.push({id:Date.now(), name, sellPrice:sell, buyPrice:buy, stock:stock});
  saveToLocalStorage();
  closeModal();
  renderProductsList();
  alert('✅ تمت الإضافة');
}
function openEditProductModal(id) {
  let p = products.find(p=>p.id===id);
  if(!p) return;
  let body = `<div class="form-group"><label>اسم المنتج</label><input type="text" id="productName" value="${p.name}"></div>
  <div class="form-group"><label>سعر البيع</label><input type="number" id="productSellPrice" value="${p.sellPrice}" step="0.01"></div>
  <div class="form-group"><label>سعر الشراء</label><input type="number" id="productBuyPrice" value="${p.buyPrice}" step="0.01"></div>
  <div class="form-group"><label>الكمية</label><input type="number" id="productStock" value="${p.stock}"></div>`;
  openModal('✏️ تعديل المنتج', body, `<button class="btn btn-primary" onclick="saveEditProduct(${id})">حفظ</button><button class="btn btn-danger" onclick="closeModal()">إلغاء</button>`);
}
function saveEditProduct(id) {
  let p = products.find(p=>p.id===id);
  if(p){
    p.name = document.getElementById('productName').value.trim();
    p.sellPrice = parseFloat(document.getElementById('productSellPrice').value);
    p.buyPrice = parseFloat(document.getElementById('productBuyPrice').value);
    p.stock = parseInt(document.getElementById('productStock').value);
    saveToLocalStorage();
    closeModal();
    renderProductsList();
    alert('✅ تم التعديل');
  }
}
function deleteProduct(id) {
  if(confirm('⚠️ حذف المنتج؟')) {
    products = products.filter(p=>p.id!==id);
    saveToLocalStorage();
    renderProductsList();
    alert('✅ تم الحذف');
  }
}

// البيع والفواتير (مختصر)
function renderSalesPage() {
  let html = `<div class="section"><div class="section-title">🛒 فاتورة جديدة</div><div class="form-row"><div class="form-group"><label>👤 العميل</label><input type="text" id="customerName"></div></div>
  <div class="form-row"><div class="form-group"><label>المنتج</label><select id="productSelect"></select></div><div class="form-group"><label>سعر مخصص</label><input type="number" id="customPrice" placeholder="اختياري"></div></div>
  <button class="btn btn-primary" onclick="addToInvoice()">➕ أضف</button><div id="invItems"></div>
  <div class="inv-total-box"><div>الإجمالي:</div><div><span id="invoiceTotal">0</span> ج</div></div>
  <div class="btn-row"><button class="btn btn-success" onclick="saveInvoice()">💾 حفظ</button><button class="btn btn-danger" onclick="clearInvoice()">🗑️ مسح</button></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
  renderProductSelect();
  renderCurrentInvoice();
}
function renderProductSelect() {
  let sel = document.getElementById('productSelect');
  if(!sel) return;
  sel.innerHTML = '<option value="">-- اختر --</option>' + products.filter(p=>p.stock>0).map(p=>`<option value="${p.id}">${p.name} - ${p.sellPrice} ج (${p.stock})</option>`).join('');
}
function addToInvoice() {
  let pid = document.getElementById('productSelect').value;
  if(!pid) return alert('اختر منتج');
  let prod = products.find(p=>p.id==pid);
  if(prod.stock<=0) return alert('غير متوفر');
  let custom = parseFloat(document.getElementById('customPrice').value);
  let price = !isNaN(custom)&&custom>0 ? custom : prod.sellPrice;
  let exist = currentInvoiceItems.find(i=>i.productId==pid);
  if(exist) {
    if(exist.quantity+1 > prod.stock) return alert('كمية أكبر من المتوفر');
    exist.quantity++;
  } else {
    currentInvoiceItems.push({productId:prod.id, name:prod.name, sellPrice:price, quantity:1});
  }
  renderCurrentInvoice();
  document.getElementById('customPrice').value='';
}
function renderCurrentInvoice() {
  let cont = document.getElementById('invItems');
  if(!cont) return;
  let html='';
  currentInvoiceItems.forEach((it,i)=>{
    let total = it.quantity * it.sellPrice;
    html+=`<div class="inv-item-row"><div>${it.name}</div><input type="number" value="${it.sellPrice}" onchange="updatePrice(${i},this.value)" style="width:100px"><div><button class="btn-sm" onclick="changeQty(${i},-1)">-</button> ${it.quantity} <button class="btn-sm" onclick="changeQty(${i},1)">+</button></div><div>${total.toFixed(2)} ج</div><button class="btn-sm btn-danger" onclick="removeItem(${i})">🗑️</button></div>`;
  });
  cont.innerHTML = html;
  let total = currentInvoiceItems.reduce((s,i)=>s+i.quantity*i.sellPrice,0);
  document.getElementById('invoiceTotal').innerText = total.toFixed(2);
}
function updatePrice(idx,val){ let p=parseFloat(val); if(!isNaN(p)&&p>0){ currentInvoiceItems[idx].sellPrice=p; renderCurrentInvoice(); } }
function changeQty(idx,delta){
  let it = currentInvoiceItems[idx];
  let prod = products.find(p=>p.id==it.productId);
  let nq = it.quantity+delta;
  if(nq<1){ removeItem(idx); return; }
  if(nq>prod.stock){ alert('كمية أكبر من المتوفر'); return; }
  it.quantity = nq;
  renderCurrentInvoice();
}
function removeItem(idx){ currentInvoiceItems.splice(idx,1); renderCurrentInvoice(); }
function clearInvoice(){ if(confirm('مسح الفاتورة؟')){ currentInvoiceItems=[]; renderCurrentInvoice(); document.getElementById('customerName').value=''; } }
function saveInvoice(){
  let cust = document.getElementById('customerName').value.trim();
  if(!cust) return alert('أدخل اسم العميل');
  if(currentInvoiceItems.length===0) return alert('أضف منتجات');
  for(let it of currentInvoiceItems){
    let prod = products.find(p=>p.id==it.productId);
    if(prod.stock<it.quantity) return alert(`كمية ${prod.name} غير متوفرة`);
    prod.stock -= it.quantity;
  }
  let total = currentInvoiceItems.reduce((s,i)=>s+i.quantity*i.sellPrice,0);
  let now = new Date();
  let date = now.toLocaleDateString('ar-EG')+' '+now.toLocaleTimeString('ar-EG');
  invoices.unshift({id:Date.now(), customer:cust, date:date, items:JSON.parse(JSON.stringify(currentInvoiceItems)), total:total});
  saveToLocalStorage();
  clearInvoice();
  alert('✅ تم حفظ الفاتورة');
  renderInvoicesPage();
}
function renderInvoicesPage(){
  let html = `<div class="section"><div class="section-title">📄 الفواتير</div><div id="invoicesList"></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
  let invHtml = invoices.length ? `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>العميل</th><th>التاريخ</th><th>الإجمالي</th><th></th></tr></thead><tbody>${invoices.map((inv,i)=>`<tr><td>${i+1}</td><td>${inv.customer}</td><td>${inv.date}</td><td>${inv.total.toFixed(2)} ج</td><td><button class="btn-sm" style="background:#3b82f6;color:white;" onclick="viewInvoice(${inv.id})">👁️</button> ${currentUser.role==='admin'?`<button class="btn-sm btn-danger" onclick="deleteInvoice(${inv.id})">🗑️</button>`:''} <button class="btn-sm" style="background:#8b5cf6;color:white;" onclick="editInvoice(${inv.id})">✏️</button></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty-state">لا توجد فواتير</div>';
  document.getElementById('invoicesList').innerHTML = invHtml;
}
function viewInvoice(id){
  let inv = invoices.find(i=>i.id===id);
  if(!inv) return;
  let itemsHtml = inv.items.map((it,idx)=>`<tr><td>${idx+1}</td><td>${it.name}</td><td>${it.quantity}</td><td>${it.sellPrice.toFixed(2)} ج</td><td>${(it.quantity*it.sellPrice).toFixed(2)} ج</td></tr>`).join('');
  let body = `<div><strong>العميل:</strong> ${inv.customer}<br><strong>التاريخ:</strong> ${inv.date}</div><div class="tbl-wrap"><table><thead><tr><th>#</th><th>المنتج</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>${itemsHtml}</tbody></table></div><div style="margin-top:20px;text-align:left;font-weight:bold;">الإجمالي: ${inv.total.toFixed(2)} ج</div>`;
  openModal('📋 تفاصيل الفاتورة', body, '<button class="btn btn-primary" onclick="closeModal()">إغلاق</button>');
}
function deleteInvoice(id){
  if(!confirm('حذف الفاتورة؟')) return;
  let inv = invoices.find(i=>i.id===id);
  if(inv){
    inv.items.forEach(item=>{
      let prod = products.find(p=>p.name===item.name);
      if(prod) prod.stock += item.quantity;
    });
    invoices = invoices.filter(i=>i.id!==id);
    saveToLocalStorage();
    renderInvoicesPage();
    alert('تم الحذف');
  }
}
function editInvoice(id){
  let inv = invoices.find(i=>i.id===id);
  if(!inv) return;
  let itemsHtml = inv.items.map((it,idx)=>`<div class="inv-item-row"><div>${it.name}</div><div>${it.sellPrice} ج</div><div><input type="number" id="editQty${idx}" value="${it.quantity}" style="width:80px"></div><div>${(it.quantity*it.sellPrice).toFixed(2)} ج</div></div>`).join('');
  let body = `<div class="form-group"><label>العميل</label><input type="text" id="editCustomer" value="${inv.customer}"></div>${itemsHtml}`;
  openModal('✏️ تعديل الفاتورة', body, `<button class="btn btn-primary" onclick="updateInvoice(${id})">حفظ</button><button class="btn btn-danger" onclick="closeModal()">إلغاء</button>`);
}
function updateInvoice(id){
  let inv = invoices.find(i=>i.id===id);
  if(!inv) return;
  inv.customer = document.getElementById('editCustomer').value.trim();
  inv.items.forEach((item,idx)=>{
    let newQty = parseInt(document.getElementById(`editQty${idx}`).value) || item.quantity;
    let diff = item.quantity - newQty;
    let prod = products.find(p=>p.name===item.name);
    if(prod) prod.stock += diff;
    item.quantity = newQty;
  });
  inv.total = inv.items.reduce((s,i)=>s+i.quantity*i.sellPrice,0);
  saveToLocalStorage();
  closeModal();
  renderInvoicesPage();
  alert('✅ تم التعديل');
}

// المرتجعات والإيرادات والنواقص والإعدادات (مختصرة للاختصار لكنها تعمل)
function renderReturnsPage(){
  let html = `<div class="section"><div class="section-title">🔄 إرجاع</div><div class="form-row"><div class="form-group"><label>اختر الفاتورة</label><select id="retInvoiceSelect"></select></div></div><button class="btn btn-primary" onclick="loadReturnInvoice()">عرض</button><div id="returnItemsArea"></div></div><div class="section"><div class="section-title">📋 سجل المرتجعات</div><div id="returnsHistory"></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
  let sel = document.getElementById('retInvoiceSelect');
  if(sel) sel.innerHTML = '<option value="">-- اختر --</option>' + invoices.map(inv=>`<option value="${inv.id}">فاتورة #${inv.id} - ${inv.customer}</option>`).join('');
  renderReturnsHistory();
}
function loadReturnInvoice(){
  let id = document.getElementById('retInvoiceSelect').value;
  if(!id) return;
  let inv = invoices.find(i=>i.id==id);
  if(!inv) return;
  let html = `<div class="tbl-wrap"></table><thead><tr><th>المنتج</th><th>الكمية</th><th>السعر</th><th>كمية الإرجاع</th></tr></thead><tbody>`;
  inv.items.forEach((it,i)=>{
    html += `<tr><td>${it.name}</td><td>${it.quantity}</td><td>${it.sellPrice} ج</td><td><input type="number" id="retQty${i}" min="0" max="${it.quantity}" value="0"></td></tr>`;
  });
  html += `</tbody></table><input type="hidden" id="returnInvId" value="${inv.id}"><div class="btn-row"><button class="btn btn-success" onclick="processReturn(${inv.id})">تأكيد الإرجاع</button></div>`;
  document.getElementById('returnItemsArea').innerHTML = html;
}
function processReturn(invId){
  let inv = invoices.find(i=>i.id==invId);
  if(!inv) return;
  let returned = [], total = 0;
  for(let i=0;i<inv.items.length;i++){
    let qty = parseInt(document.getElementById(`retQty${i}`)?.value||0);
    if(qty>0){
      let prod = products.find(p=>p.name===inv.items[i].name);
      if(prod) prod.stock += qty;
      returned.push({name:inv.items[i].name, quantity:qty, price:inv.items[i].sellPrice});
      total += qty * inv.items[i].sellPrice;
    }
  }
  if(returned.length===0) return alert('لم تختر أي منتجات');
  let now = new Date();
  let date = now.toLocaleDateString('ar-EG')+' '+now.toLocaleTimeString('ar-EG');
  returns.unshift({id:Date.now(), invoiceId:invId, date, items:returned, total});
  saveToLocalStorage();
  document.getElementById('returnItemsArea').innerHTML = '';
  renderReturnsHistory();
  alert(`✅ تم الإرجاع بقيمة ${total.toFixed(2)} ج`);
}
function renderReturnsHistory(){
  let c = document.getElementById('returnsHistory');
  if(!c) return;
  if(returns.length===0){ c.innerHTML='<div class="empty-state">لا توجد مرتجعات</div>'; return; }
  let html = `<div class="tbl-wrap"><table><thead><tr><th>#</th><th>التاريخ</th><th>الفاتورة</th><th>المنتجات</th><th>الإجمالي</th></tr></thead><tbody>`;
  returns.forEach((r,i)=>{ html+=`<tr><td>${i+1}</td><td>${r.date}</td><td>#${r.invoiceId}</td><td>${r.items.map(it=>`${it.name} x${it.quantity}`).join(', ')}</td><td>${r.total.toFixed(2)} ج</td></tr>`; });
  html+='</tbody></table></div>';
  c.innerHTML = html;
}
function renderRevenuePage(){
  let today = new Date().toISOString().split('T')[0];
  let todayTotal=0, monthTotal=0, allTotal=0;
  let now=new Date(), monthStart=new Date(now.getFullYear(), now.getMonth(),1);
  invoices.forEach(inv=>{
    let d = inv.date.split(' ')[0];
    allTotal += inv.total;
    if(d===today) todayTotal+=inv.total;
    if(new Date(d)>=monthStart) monthTotal+=inv.total;
  });
  let retTotal = returns.reduce((s,r)=>s+r.total,0);
  let net = allTotal - retTotal;
  let html = `<div class="stat-grid"><div class="stat-card"><div>اليوم</div><div class="stat-val">${todayTotal.toFixed(0)} ج</div></div><div class="stat-card"><div>هذا الشهر</div><div class="stat-val">${monthTotal.toFixed(0)} ج</div></div><div class="stat-card"><div>الإجمالي</div><div class="stat-val">${allTotal.toFixed(0)} ج</div></div><div class="stat-card"><div>المرتجعات</div><div class="stat-val">${retTotal.toFixed(0)} ج</div></div><div class="stat-card"><div>صافي الإيرادات</div><div class="stat-val">${net.toFixed(0)} ج</div></div></div><div class="section"><div class="section-title">📊 جميع الفواتير</div>${renderInvoicesTable(invoices)}</div>`;
  document.getElementById('contentArea').innerHTML = html;
}
function renderShortagesPage(){
  let low = products.filter(p=>p.stock<LOW_STOCK_THRESHOLD);
  let html = `<div class="section"><div class="section-title">⚠️ المنتجات الناقصة</div><div id="shortList"></div><div class="btn-row"><button class="btn btn-primary" onclick="printShortages()">🖨️ طباعة</button></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
  let shortList = document.getElementById('shortList');
  if(low.length===0) shortList.innerHTML='<div class="empty-state">✅ ممتاز! جميع المنتجات متوفرة</div>';
  else {
    let table = `<div class="tbl-wrap"><tr><thead><tr><th>#</th><th>المنتج</th><th>الرصيد</th><th>الحد الأدنى</th><th>الفرق</th><th>سعر الشراء</th><th>التكلفة</th></tr></thead><tbody>`;
    low.forEach((p,i)=>{
      let shortage = LOW_STOCK_THRESHOLD - p.stock;
      let cost = shortage * p.buyPrice;
      table += `<tr><td>${i+1}</td><td>${p.name}</td><td class="tag-red">${p.stock}</td><td>${LOW_STOCK_THRESHOLD}</td><td class="tag-red">${shortage}</td><td>${p.buyPrice} ج</td><td>${cost.toFixed(2)} ج</td></tr>`;
    });
    table += '</tbody></table></div>';
    shortList.innerHTML = table;
  }
}
function printShortages(){
  let low = products.filter(p=>p.stock<LOW_STOCK_THRESHOLD);
  let html = `<div style="direction:rtl; padding:20px;"><div style="text-align:center; margin-bottom:20px;"><img src="logo-badran.png" style="width:80px;"><h2>تقرير المنتجات الناقصة</h2><p>${new Date().toLocaleString('ar-EG')}</p></div>
  <table border="1" style="width:100%; border-collapse:collapse;"><thead><tr><th>#</th><th>المنتج</th><th>الرصيد</th><th>الحد الأدنى</th><th>الفرق</th><th>سعر الشراء</th><th>التكلفة</th></tr></thead><tbody>`;
  low.forEach((p,i)=>{
    let shortage = LOW_STOCK_THRESHOLD - p.stock;
    let cost = shortage * p.buyPrice;
    html += `<tr><td>${i+1}</td><td>${p.name}</td><td>${p.stock}</td><td>${LOW_STOCK_THRESHOLD}</td><td>${shortage}</td><td>${p.buyPrice}</td><td>${cost}</td></tr>`;
  });
  html += `</tbody></table><p style="margin-top:20px;">تم الطباعة بواسطة نظام Badran CNC</p></div>`;
  let win = window.open('','','width=800,height=600');
  win.document.write(html);
  win.document.close();
  win.print();
}
function renderSettingsPage(){
  if(currentUser.role!=='admin') return;
  let html = `<div class="section"><div class="section-title">⚙️ الإعدادات</div><div class="btn-row"><button class="btn btn-primary" onclick="alert('سيتم تطوير هذه الميزة')">تغيير باسورد المدير</button><button class="btn btn-primary" onclick="alert('سيتم تطويرها')">تغيير باسورد الموظف</button><button class="btn btn-danger" onclick="exportData()">📥 تصدير البيانات</button><button class="btn btn-danger" onclick="clearAllData()">🗑️ حذف الكل</button></div></div>`;
  document.getElementById('contentArea').innerHTML = html;
}
function exportData(){
  const data = JSON.stringify({products, invoices, returns}, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `badran-backup-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  alert('✅ تم تصدير البيانات');
}
function clearAllData(){
  if(confirm('⚠️ حذف جميع البيانات؟')) {
    products = []; invoices = []; returns = [];
    localStorage.clear();
    alert('تم الحذف');
    renderSettingsPage();
  }
}

// دوال الـ Modal
function openModal(title, body, buttonsHtml){
  const modal = document.getElementById('modal');
  modal.querySelector('.modal-header').innerText = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalFooter').innerHTML = buttonsHtml;
  modal.classList.add('active');
}
function closeModal(){
  document.getElementById('modal').classList.remove('active');
}
document.addEventListener('click', function(e) {
  if(e.target === document.getElementById('modal')) closeModal();
});

window.addEventListener('load', loadFromLocalStorage);
</script>
