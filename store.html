<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badran CNC - متجر CNC بدران</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<style>
:root{--primary:#0a3d7c;--primary-mid:#0056b3;--accent:#c0392b;--success:#27ae60;--warning:#f39c12;--light:#f7f9fc;--text:#1a1e2e;--border:#e2e8f0;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Cairo',sans-serif;background:var(--light);color:var(--text);direction:rtl;min-height:100vh;}
header{background:linear-gradient(135deg,var(--primary),var(--primary-mid));position:sticky;top:0;z-index:200;box-shadow:0 4px 12px rgba(0,0,0,.1);}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;max-width:1400px;margin:0 auto;gap:15px;}
.logo-area{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1;}
.logo-text h1{color:white;font-size:1.1rem;font-weight:900;}
.header-actions{display:flex;gap:10px;align-items:center;}
.search-bar{background:rgba(255,255,255,.15);border-radius:30px;padding:8px 12px;display:flex;align-items:center;gap:6px;}
.search-bar input{background:0;border:0;outline:0;color:white;width:120px;font-family:'Cairo';font-size:.85rem;}
.hdr-btn{background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:6px 12px;font-weight:700;cursor:pointer;font-family:'Cairo';position:relative;transition:all.3s;}
.hdr-btn:hover{background:rgba(255,255,255,.25);}
.cart-count{position:absolute;top:-8px;left:-8px;background:var(--accent);color:white;width:20px;height:20px;border-radius:50%;font-size:.65rem;font-weight:700;display:flex;align-items:center;justify-content:center;}
.admin-link{background:var(--warning);color:white;padding:6px 12px;border-radius:20px;font-weight:700;cursor:pointer;text-decoration:none;font-size:.85rem;}
.hero-strip{background:linear-gradient(90deg,var(--accent),#e74c3c);color:white;text-align:center;padding:10px 15px;font-weight:600;font-size:.8rem;}
.stats-bar{background:white;border-bottom:1px solid var(--border);padding:12px 20px;}
.stats-inner{max-width:1400px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
.stat-item{display:flex;align-items:center;gap:6px;font-size:.85rem;font-weight:600;}
.category-pills{display:flex;gap:6px;flex-wrap:wrap;}
.pill{padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:600;border:1px solid var(--border);background:white;cursor:pointer;transition:all.3s;font-family:'Cairo';}
.pill:hover{border-color:var(--primary);}
.pill.active{background:var(--primary-mid);border-color:var(--primary-mid);color:white;}
.grid-container{max-width:1400px;margin:0 auto;padding:20px;}
.products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;}
.product-card{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06);border:1px solid var(--border);cursor:pointer;transition:all.3s;}
.product-card:hover{transform:translateY(-4px);box-shadow:0 6px 16px rgba(0,0,0,.1);}
.card-img-wrap{height:150px;background:linear-gradient(135deg,var(--light),.1);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-size:2.5rem;}
.stock-badge{position:absolute;top:8px;left:8px;background:var(--success);color:white;padding:3px 8px;border-radius:10px;font-size:.7rem;font-weight:700;}
.stock-badge.low{background:var(--warning);}
.stock-badge.out{background:var(--accent);}
.card-body{padding:12px;}
.card-name{font-size:.85rem;font-weight:700;margin-bottom:6px;min-height:2rem;overflow:hidden;}
.price{background:linear-gradient(135deg,var(--accent),#e74c3c);color:white;padding:4px 10px;border-radius:16px;font-size:.8rem;font-weight:700;}
.add-cart-btn{width:100%;background:var(--primary-mid);color:white;border:0;padding:7px;border-radius:8px;font-weight:700;cursor:pointer;font-family:'Cairo';transition:all.3s;}
.add-cart-btn:hover{background:var(--primary);}
.add-cart-btn:disabled{background:#ccc;cursor:not-allowed;}
.cart-sidebar{position:fixed;top:0;left:0;width:100%;max-width:400px;height:100%;background:white;z-index:4001;transform:translateX(-100%);transition:transform.35s ease-out;display:flex;flex-direction:column;box-shadow:-2px 0 16px rgba(0,0,0,.12);}
.cart-sidebar.open{transform:translateX(0);}
.cart-header{padding:14px;background:linear-gradient(135deg,var(--primary),var(--primary-mid));color:white;display:flex;justify-content:space-between;align-items:center;}
.cart-items{flex:1;overflow-y:auto;padding:12px;}
.cart-empty{text-align:center;padding:40px 15px;color:#999;}
.cart-item{display:grid;grid-template-columns:50px 1fr 35px;gap:10px;padding:10px;background:var(--light);border-radius:10px;margin-bottom:8px;align-items:center;border:1px solid var(--border);}
.cart-item-info{display:flex;flex-direction:column;gap:3px;}
.cart-item-name{font-weight:700;font-size:.85rem;}
.cart-item-price{color:var(--accent);font-weight:700;font-size:.8rem;}
.qty-control{display:flex;gap:3px;align-items:center;}
.qty-control button{background:white;border:1px solid var(--border);width:22px;height:22px;border-radius:4px;cursor:pointer;font-weight:700;transition:all.2s;}
.qty-control button:hover{background:var(--primary);color:white;}
.remove-btn{background:0;border:0;cursor:pointer;font-size:1rem;}
.cart-footer{padding:12px;border-top:1px solid var(--border);background:var(--light);}
.cart-summary{display:flex;justify-content:space-between;margin-bottom:8px;font-weight:600;font-size:.9rem;}
.cart-total{font-size:1rem;color:var(--accent);margin-bottom:10px;font-weight:700;}
.checkout-btn{width:100%;padding:10px;background:var(--success);color:white;border:0;border-radius:10px;font-weight:700;cursor:pointer;font-family:'Cairo';transition:all.3s;}
.checkout-btn:hover{background:#229954;}
.checkout-btn:disabled{background:#ccc;cursor:not-allowed;}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:3000;justify-content:center;align-items:center;padding:15px;}
.modal.open{display:flex;}
.modal-content{background:white;width:100%;max-width:450px;border-radius:16px;overflow-y:auto;max-height:90vh;padding:20px;position:relative;}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border);}
.modal-header h2{font-size:1.15rem;}
.close-btn{background:0;border:0;font-size:1.3rem;cursor:pointer;color:#999;}
.detail-price{font-size:1.5rem;font-weight:900;color:var(--accent);margin:12px 0;}
.detail-stock{color:#999;font-size:.9rem;}
.qty-selector{display:flex;align-items:center;gap:8px;margin:12px 0;}
.qty-selector button{background:var(--primary-mid);color:white;width:32px;height:32px;border:0;border-radius:6px;cursor:pointer;font-weight:700;}
.qty-selector button:hover{background:var(--primary);}
.modal-actions{display:flex;gap:8px;margin-top:16px;}
.modal-actions button{flex:1;padding:10px;border:0;border-radius:8px;font-weight:700;cursor:pointer;font-family:'Cairo';transition:all.3s;}
.modal-add-btn{background:var(--success);color:white;}
.modal-add-btn:hover{background:#229954;}
.modal-close-btn{background:var(--light);color:var(--text);border:1px solid var(--border);}
.empty-state{text-align:center;padding:50px 15px;color:#999;}
#toast{position:fixed;bottom:20px;right:20px;background:rgba(26,30,46,.95);color:white;padding:10px 14px;border-radius:10px;opacity:0;transition:opacity.3s;z-index:9999;max-width:250px;font-size:.85rem;}
#toast.show{opacity:1;}
@media(max-width:768px){.products-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}.search-bar{display:none;}.header-inner{padding:10px 12px;}}
</style>
</head>
<body>
<header>
<div class="header-inner">
<div class="logo-area" onclick="location.href='/'">
<div class="logo-text"><h1>🏭 Badran CNC</h1></div>
</div>
<div class="header-actions">
<div class="search-bar">
<span>🔍</span>
<input type="text" id="searchInput" placeholder="ابحث...">
</div>
<a href="admin.html" class="admin-link">🔐 تحكم</a>
<button class="hdr-btn" onclick="openCart()">
🛒 السلة <span class="cart-count" id="cartCount">0</span>
</button>
</div>
</div>
</header>
<div class="hero-strip">🚀 شحن سريع | 💳 دفع آمن | ✅ جودة مضمونة</div>
<div class="stats-bar">
<div class="stats-inner">
<div class="stat-item">📦 <strong id="statsCount">0</strong> منتج</div>
<div class="category-pills" id="categoryPills">
<div class="pill active" onclick="filterCategory('all',this)">الكل</div>
</div>
</div>
</div>
<div class="grid-container">
<div class="products-grid" id="mainGrid">
<div class="empty-state">⏳ جاري التحميل...</div>
</div>
</div>
<div id="cartSidebar" class="cart-sidebar">
<div class="cart-header"><h2>🛒 السلة</h2><button class="close-btn" onclick="closeCart()">✖</button></div>
<div id="cartItemsList" class="cart-items"><div class="cart-empty">السلة فارغة</div></div>
<div class="cart-footer">
<div class="cart-summary"><span>العدد:</span><span id="itemCount">0</span></div>
<div class="cart-total">الإجمالي: <strong id="cartTotal">0</strong> ج</div>
<button class="checkout-btn" onclick="checkout()" id="checkoutBtn" disabled>💳 شراء</button>
</div>
</div>
<div id="productModal" class="modal">
<div class="modal-content" id="modalContent"></div>
</div>
<div id="toast"></div>
<script>
let allProducts=[],cart=JSON.parse(localStorage.getItem('badran_store_cart')||'[]'),currentCategory='all',selectedQty=1;
function loadFromAdmin(){const admin=localStorage.getItem('badran_products');return admin?JSON.parse(admin):[];}
function loadProducts(){allProducts=loadFromAdmin();if(!allProducts.length){allProducts=[{id:1,name:"سبندل 2.2 كيلو",sellPrice:4500,stock:10},{id:2,name:"كنترولر Mach3",sellPrice:1250,stock:15},{id:3,name:"موتور Nema23",sellPrice:890,stock:25},{id:4,name:"دراع روبوت",sellPrice:3200,stock:5},{id:5,name:"سيرفو 1.5kw",sellPrice:2850,stock:18}];}document.getElementById('statsCount').innerText=allProducts.length;renderGrid();}
function renderGrid(){const search=document.getElementById('searchInput').value.toLowerCase(),filtered=allProducts.filter(p=>p.name.toLowerCase().includes(search)&&(currentCategory==='all'||p.category===currentCategory)),grid=document.getElementById('mainGrid');if(!filtered.length){grid.innerHTML='<div class="empty-state">❌ لا توجد منتجات</div>';return;}let html='';filtered.forEach(p=>{let stockClass=p.stock===0?'out':p.stock<10?'low':'',stockText=p.stock===0?'غير متوفر':p.stock<10?`متبقي:${p.stock}`:'متوفر';html+=`<div class="product-card" onclick="openProductModal(${p.id})"><div class="card-img-wrap"><span class="stock-badge ${stockClass}">${stockText}</span>📦</div><div class="card-body"><div class="card-name">${p.name}</div><div class="price">${p.sellPrice} ج</div><button class="add-cart-btn" onclick="event.stopPropagation();addToCart(${p.id})" ${p.stock===0?'disabled':''}}>➕ أضف</button></div></div>`;});grid.innerHTML=html;}
function filterCategory(cat,el){currentCategory=cat;document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));if(el)el.classList.add('active');renderGrid();}
function addToCart(pid){const prod=allProducts.find(p=>p.id===pid);if(!prod)return;if(prod.stock===0){showToast('❌ غير متوفر');return;}const existing=cart.find(i=>i.id===pid);existing?existing.qty++:cart.push({id:prod.id,name:prod.name,price:prod.sellPrice,qty:1});saveCart();showToast(`✅ تمت الإضافة`);}
function saveCart(){localStorage.setItem('badran_store_cart',JSON.stringify(cart));updateCartUI();}
function updateCartUI(){const totalItems=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cartCount').innerText=totalItems;document.getElementById('itemCount').innerText=totalItems;const container=document.getElementById('cartItemsList');if(!cart.length){container.innerHTML='<div class="cart-empty">السلة فارغة</div>';document.getElementById('cartTotal').innerText='0';document.getElementById('checkoutBtn').disabled=true;return;}let html='',total=0;cart.forEach((item,idx)=>{const itemTotal=item.price*item.qty;total+=itemTotal;html+=`<div class="cart-item"><div style="font-size:1.5rem;">📦</div><div class="cart-item-info"><div class="cart-item-name">${item.name}</div><div class="cart-item-price">${item.price} ج</div><div class="qty-control"><button onclick="changeQty(${idx},-1)">−</button><span>${item.qty}</span><button onclick="changeQty(${idx},1)">+</button></div></div><button class="remove-btn" onclick="removeFromCart(${idx})">🗑️</button></div>`;});container.innerHTML=html;document.getElementById('cartTotal').innerText=total.toFixed(0);document.getElementById('checkoutBtn').disabled=false;}
function changeQty(idx,delta){let newQty=cart[idx].qty+delta;if(newQty<1){removeFromCart(idx);}else{cart[idx].qty=newQty;}saveCart();}
function removeFromCart(idx){const item=cart[idx];cart.splice(idx,1);saveCart();showToast(`✅ تم الحذف`);}
function openCart(){document.getElementById('cartSidebar').classList.add('open');}
function closeCart(){document.getElementById('cartSidebar').classList.remove('open');}
function checkout(){if(!cart.length){showToast('❌ السلة فارغة');return;}const total=cart.reduce((s,i)=>s+i.price*i.qty,0),itemsList=cart.map(i=>`${i.name} × ${i.qty}`).join('\n');alert(`✅ الطلب جاهز!\n\n${itemsList}\n\nالإجمالي: ${total} ج\n\nسيتم التواصل معك للتأكيد`);cart=[];saveCart();closeCart();showToast('✅ تم إرسال الطلب');}
function openProductModal(pid){const prod=allProducts.find(p=>p.id===pid);if(!prod)return;selectedQty=1;let stockStatus=prod.stock===0?'<span style="color:var(--accent);font-weight:700;">❌ غير متوفر</span>':prod.stock<10?`<span style="color:var(--warning);font-weight:700;">⚠️ متبقي:${prod.stock}</span>`:'<span style="color:var(--success);font-weight:700;">✅ متوفر</span>';const modalHtml=`<div class="modal-header"><h2>${prod.name}</h2><button class="close-btn" onclick="closeModal()">✖</button></div><div style="padding:15px;"><div style="text-align:center;font-size:2.5rem;margin:15px 0;">📦</div><div class="detail-price">${prod.sellPrice} ج</div><div>${stockStatus}</div><div style="margin:15px 0;background:var(--light);padding:10px;border-radius:8px;"><strong>الكمية:</strong><div class="qty-selector"><button onclick="selectedQty=Math.max(1,selectedQty-1);updateQtyDisplay()">−</button><input type="number" id="qtyInput" value="1" min="1" max="${prod.stock}" onchange="selectedQty=parseInt(this.value)||1;updateQtyDisplay();"><button onclick="selectedQty=Math.min(${prod.stock},selectedQty+1);updateQtyDisplay()">+</button></div></div><div style="background:var(--light);padding:10px;border-radius:8px;margin-bottom:15px;"><strong>المجموع:</strong> <span id="totalDisplay">${prod.sellPrice} ج</span></div><div class="modal-actions"><button class="modal-add-btn" onclick="addFromModal(${prod.id});closeModal()" ${prod.stock===0?'disabled style="opacity:.5;cursor:not-allowed;"':''}}>✅ أضف للسلة</button><button class="modal-close-btn" onclick="closeModal()">إغلاق</button></div></div>`;document.getElementById('modalContent').innerHTML=modalHtml;document.getElementById('productModal').classList.add('open');}
function updateQtyDisplay(){const firstProd=allProducts[0];const total=selectedQty*firstProd.sellPrice;document.getElementById('totalDisplay').innerText=total+' ج';document.getElementById('qtyInput').value=selectedQty;}
function addFromModal(pid){for(let i=0;i<selectedQty;i++){addToCart(pid);}}
function closeModal(){document.getElementById('productModal').classList.remove('open');}
function showToast(msg){const toast=document.getElementById('toast');toast.innerText=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),3000);}
document.getElementById('searchInput').addEventListener('input',()=>renderGrid());document.getElementById('cartSidebar').addEventListener('click',(e)=>{if(e.target===document.getElementById('cartSidebar'))closeCart();});document.getElementById('productModal').addEventListener('click',(e)=>{if(e.target===document.getElementById('productModal'))closeModal();});
window.addEventListener('load',()=>{loadProducts();updateCartUI();});
setInterval(()=>{loadProducts();},5000);
</script>
</body>
</html>
